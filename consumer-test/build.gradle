plugins {
  id 'com.android.application' version '8.13.2'
  id 'org.jetbrains.kotlin.android' version '2.3.21'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
  id 'com.ncorti.ktfmt.gradle' version '0.25.0'
}
android {
  namespace = 'com.squareup.overstory.sample'
  compileSdk = 35
  defaultConfig {
    applicationId = 'com.squareup.overstory.sample'
    minSdk = 24
    targetSdk = 35
    versionCode = 1
    versionName = '1.0'
    testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
  }
  buildFeatures { compose = true }
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
  }
  kotlinOptions { jvmTarget = '11' }
}
ktfmt { googleStyle() }
dependencies {
  implementation "com.squareup.overstory:view-compat:${providers.gradleProperty('overstoryVersion').get()}"
  implementation 'androidx.activity:activity-compose:1.10.1'
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.9.5'
